# Keeps the Render free-tier backend warm by hitting /health periodically.
# Free web services on Render spin down after ~15 minutes of no inbound traffic
# (cold start on the next real request). This workflow pings it more often than
# that so it stays warm. If usage grows, upgrading to a paid instance removes
# the need for this entirely.
#
# GitHub throttles low-traffic scheduled workflows, so actual runs land far
# apart than the cron implies — often past the 15min spin-down window. That
# guarantees an occasional cold start, which can take 30-60s. The timeout
# below is sized to tolerate that instead of failing the job on it.

name: Render Keepalive

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: GET /health
        run: |
          curl -fsS -m 75 --retry 2 --retry-delay 5 https://troupe-api-dck1.onrender.com/health
